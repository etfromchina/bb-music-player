<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiliMusic - B站/YouTube 音频精简播放器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page" id="main-container">
      <section class="tips" id="tips">
        <p>提示：点列表右上角「+」添加 Bilibili 或 YouTube 链接，可持续追加到当前歌单并自动保存。</p>
      </section>

      <section class="player" id="player-container">
        <section class="control-area">
          <div id="cover-wrapper" class="cover-wrapper empty">
            <img id="cover-img" class="cover-image hidden" alt="封面" referrerpolicy="no-referrer" />
            <div id="cover-fallback" class="cover-fallback">♪</div>
          </div>

          <div class="actions-top">
            <button id="pip-btn" class="icon-btn" title="独立悬浮窗口 (置顶)">▣</button>
            <button id="clear-btn" class="icon-btn" title="清空列表">✕</button>
          </div>

          <div class="meta-block">
            <p id="album-title" class="album-title">等待解析...</p>
            <p id="now-playing" class="now-playing">当前无播放任务</p>
          </div>

          <div class="play-controls">
            <button id="prev-btn" class="control-btn" disabled title="上一首">⏮</button>
            <button id="play-btn" class="play-btn" disabled title="播放/暂停">▶</button>
            <button id="next-btn" class="control-btn" disabled title="下一首">⏭</button>
          </div>

          <div class="volume-row">
            <span class="volume-icon">🔊</span>
            <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" />
            <span id="volume-text" class="volume-text">80%</span>
            <button id="quality-btn" class="icon-btn quality-btn" title="切换音质">H</button>
          </div>
        </section>

        <section class="playlist-panel">
          <header class="playlist-header">
            <p class="playlist-title">播放列表</p>
            <div class="playlist-actions">
              <button id="add-link-btn" class="icon-btn" title="添加链接">＋</button>
              <button id="toggle-list-btn" class="icon-btn" title="展开/收起列表">◧</button>
            </div>
          </header>
          <section id="playlist" class="playlist"></section>
        </section>
      </section>

      <section id="add-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-card">
          <p class="modal-title">添加链接</p>
          <form id="add-form" class="modal-form">
            <input
              id="url-input"
              type="text"
              placeholder="粘贴视频链接（支持 bilibili.com / b23.tv / youtube.com / youtu.be）"
            />
            <div class="modal-actions">
              <button type="button" id="cancel-add-btn" class="btn-muted">取消</button>
              <button type="submit" id="confirm-add-btn" class="btn-primary">解析并添加</button>
            </div>
          </form>
          <span id="loader" class="loader hidden" aria-hidden="true"></span>
        </div>
      </section>

      <audio id="audio" preload="metadata"></audio>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
